services:
  db:
    image: mysql:8.0
    container_name: portfolio_db
    environment:
      MYSQL_ROOT_PASSWORD: R00t@Portf0li0_2026
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: P0rtf0li0_User_2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_pma
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 300M
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - db
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: always

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: portfolio_webapp
    user: "33:33"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
    restart: always

  nginx:
    image: nginx:latest
    container_name: portfolio_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - webapp
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: always

volumes:
  db_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
